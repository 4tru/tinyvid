[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tinyvid"
version = "0.1.0"
description = "A tiny, surprisingly good video codec (Python)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "opencv-python",
    "scipy",
]

[project.scripts]
tinyvid = "tinyvid.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tinyvid*"]
